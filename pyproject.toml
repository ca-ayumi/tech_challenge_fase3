[tool.poetry]
name = "assistente-medico"
version = "1.0.0"
description = "Assistente clinico institucional com LLM ajustada por LoRA, LangChain e LangGraph"
authors = ["FIAP - IA para DEVS - Tech Challenge Fase 3"]
readme = "README.md"
packages = [{ include = "assistente_medico" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
langchain = "^1.0"
langchain-core = "^1.0"
langchain-community = "^0.4"
langgraph = "^1.0"
rank-bm25 = "^0.2"
pydantic = "^2.7"
python-dotenv = "^1.0"
pandas = "^2.2"
streamlit = "^1.36"
rich = "^13.7"

[tool.poetry.group.treino.dependencies]
mlx-lm = { version = "^0.20", markers = "sys_platform == 'darwin' and platform_machine == 'arm64'" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.5"

[tool.poetry.scripts]
assistente-medico = "assistente_medico.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "dados", "modelos", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
